    /* =========================================================
       EQUIPOS
       ========================================================= */

    .teams-grid {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 14px;

      padding: 18px;

    }


    .team-card {

      display: flex;

      align-items: center;

      gap: 13px;

      min-height: 92px;

      padding: 15px;

      background: #f8fafc;

      border:

      border-radius: 15px;

      color: #10233f;

      text-decoration: none;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;

    }


    .team-card:hover {

      transform:
        translateY(-2px);

      background: white;

      border-color:
        #9fc5e2;

      box-shadow:
        0 7px 18px
        rgba(15, 39, 67, 0.09);

    }


    .team-crest {

      width: 58px;

      height: 58px;

      object-fit: contain;

      flex-shrink: 0;

    }


    .team-info {

      min-width: 0;

    }


    .team-name {

      color: #10233f;

      font-size: 15px;

      font-weight: 800;

      line-height: 1.25;

    }


    .team-zone {

      margin-top: 5px;

      color: #718198;

      font-size: 12px;

      line-height: 1.3;

    }

      font-size: 15px;

    }

      flex-shrink: 0;

      padding:

      border-radius: 11px;

      color: #17365d;

      text-decoration: none;

      font-weight: 800;

        grid-template-columns: 1fr;

      }


      .team-card {

        min-height: 88px;

        border-radius: 14px;

      }


      .team-crest {

        width: 55px;

        height: 55px;

      }


      .playoff-card {

        flex-direction: column;

        align-items: flex-start;

        border-radius: 16px;

      }


      .playoff-button {

    /* =========================================================

       ========================================================= */

    const zonasContainer =
      document.getElementById(
        "zonasContainer"
      );


    /* =========================================================
       CREAR EQUIPO
       ========================================================= */

    function crearEquipo(
      equipo,
      zona
    ) {

      const nombre =
        typeof equipo === "string"
          ? equipo
          : equipo.equipo;


      const escudo =
        escudos[nombre] || "";


      const url =
        "equipo.html?v=12&equipo=" +
        encodeURIComponent(nombre) +
        "&zona=" +
        encodeURIComponent(zona);


      return `

        <a
          href="${url}"
          class="team-card"
        >

          ${
            escudo
              ? `

                <img
                  src="${escudo}"
                  alt="Escudo de ${nombre}"
                  class="team-crest"
                  loading="lazy"
                >

              `
              : `

                <div
                  class="team-crest"
                  aria-hidden="true"
                ></div>

              `
          }


          <div class="team-info">

            <div class="team-name">
              ${nombre}
            </div>


            <div class="team-zone">
              Zona ${zona} · Ver equipo
            </div>

          </div>

        </a>

      `;

    }


    /* =========================================================
       MOSTRAR ZONAS
       ========================================================= */

    function mostrarZonas() {

      if (
        typeof datosLiga ===
          "undefined" ||
        !datosLiga.zonas
      ) {

        zonasContainer.innerHTML = `

          <div
            style="
              background:white;
              padding:30px;
              border-radius:20px;
              text-align:center;
              border:1px solid #dce5ef;
            "
          >

            No se pudieron cargar
            los equipos.

          </div>

        `;

        return;

      }


      const ordenZonas = [
        "A",
        "B",
        "C",
        "D",
        "E",
        "F"
      ];


      zonasContainer.innerHTML =

        ordenZonas

          .map(
            zona => {

              const equipos =
                datosLiga.zonas[zona] ||
                [];


              return `

                <section
                  class="zone-section"
                >

                  <div
                    class="zone-card"
                  >


                    <div
                      class="zone-header"
                    >

                      <h3>
                        Zona ${zona}
                      </h3>


                      <span>

                        ${equipos.length}

                        ${
                          equipos.length === 1
                            ? "equipo"
                            : "equipos"
                        }

                      </span>

                    </div>


                    <div
                      class="teams-grid"
                    >

                      ${
                        equipos

                          .map(
                            equipo =>
                              crearEquipo(
                                equipo,
                                zona
                              )
                          )

                          .join("")
                      }

                    </div>


                  </div>

                </section>

              `;

            }
          )

          .join("");

    }


    /* =========================================================
       HEADER AL HACER SCROLL
       ========================================================= */

    let ultimaPosicion =
      window.scrollY;


    const header =
      document.getElementById(
        "siteHeader"
      );


    window.addEventListener(
      "scroll",
      () => {

        const posicionActual =
          window.scrollY;


        if (
          posicionActual >
            ultimaPosicion &&
          posicionActual >
            120
        ) {

          header.classList.add(
            "hidden"
          );

        }

        else {

          header.classList.remove(
            "hidden"
          );

        }


        ultimaPosicion =
          posicionActual;

      },
      {
        passive: true
      }
    );


    /* =========================================================
       INICIAR
       ========================================================= */

    mostrarZonas();
