    /* =========================================================
       CARGAR FECHAS
       ========================================================= */

    function cargarFechas() {

      filtroFecha.innerHTML = `

        <option value="TODAS">
          Todas las fechas
        </option>

      `;


      for (
        let fecha = 1;
        fecha <= 14;
        fecha++
      ) {

        filtroFecha.innerHTML += `

          <option value="${fecha}">
            Fecha ${fecha}
          </option>

        `;

      }

    }


    /* =========================================================
       OBTENER TODOS LOS EQUIPOS
       ========================================================= */

    function obtenerTodosLosEquipos() {

      const equipos =
        new Set();


      for (
        const zona in datosLiga.zonas
      ) {

        const lista =
          datosLiga.zonas[zona];


        if (
          !Array.isArray(lista)
        ) {

          continue;

        }


        lista.forEach(
          equipo => {

            if (
              typeof equipo ===
              "string"
            ) {

              equipos.add(
                equipo
              );

            }

            else if (
              equipo &&
              typeof equipo.equipo ===
              "string"
            ) {

              equipos.add(
                equipo.equipo
              );

            }

          }
        );

      }


      return Array.from(
        equipos
      ).sort(
        (a, b) =>
          a.localeCompare(
            b,
            "es"
          )
      );

    }


    /* =========================================================
       CARGAR EQUIPOS
       ========================================================= */

    function cargarEquipos() {

      filtroEquipo.innerHTML = `

        <option value="TODOS">
          Todos los equipos
        </option>

      `;


      const equipos =
        obtenerTodosLosEquipos();

        equipo => {

          filtroEquipo.innerHTML += `

            <option
              value="${equipo}"
            >

    function partidoPerteneceAZona(
      partido,
      zona
    ) {

      if (
        zona === "TODAS"
      ) {

        return true;

      }


      if (
        zona === "INTERZONAL"
      ) {

        return (
          partido.interzonal === true
        );

      }


      if (
        partido.interzonal === true
      ) {

        return (
          Array.isArray(
            partido.zonas
          ) &&
          partido.zonas.includes(
            zona
          )
        );

      }


      return (
        partido.zona === zona
      );

    }


    /* =========================================================
       ESTADO
       ========================================================= */

    function obtenerEstadoPartido(
      partido
    ) {

      const tieneResultado =

        partido.golesLocal !==
          null &&

        partido.golesLocal !==
          undefined &&

        partido.golesVisitante !==
          null &&

        partido.golesVisitante !==
          undefined;


      return tieneResultado
        ? "FINALIZADO"
        : "PROGRAMADO";

    }


    /* =========================================================
       FILTRAR
       ========================================================= */

    function obtenerPartidosFiltrados() {

      if (
        !datosLiga ||
        !Array.isArray(
          datosLiga.partidos
        )
      ) {

        return [];

      }


      return datosLiga.partidos

        .filter(
          partido => {


            if (
              filtroFecha.value !==
              "TODAS"
            ) {

              if (
                Number(
                  partido.fecha
                ) !==
                Number(
                  filtroFecha.value
                )
              ) {

                return false;

              }

            }


            if (
              !partidoPerteneceAZona(
                partido,
                filtroZona.value
              )
            ) {

              return false;

            }


            if (
              filtroEquipo.value !==
              "TODOS"
            ) {

              const equipo =
                filtroEquipo.value;


              if (
                partido.local !==
                  equipo &&
                partido.visitante !==
                  equipo
              ) {

                return false;

              }

            }


            const estado =
              obtenerEstadoPartido(
                partido
              );


            if (
              filtroEstado.value !==
                "TODOS" &&

              estado !==
                filtroEstado.value
            ) {

              return false;

            }


            return true;

          }
        )

        .sort(
          (a, b) => {

            const fechaA =
              Number(
                a.fecha
              );


            const fechaB =
              Number(
                b.fecha
              );


            if (
              fechaA !==
              fechaB
            ) {

              return (
                fechaA -
                fechaB
              );

            }


            return String(
              a.local
            ).localeCompare(
              String(
                b.local
              ),
              "es"
            );

          }
        );

    }


    /* =========================================================
       CREAR PARTIDO
       ========================================================= */

    function crearPartido(
      partido
    ) {

      const estado =
        obtenerEstadoPartido(
          partido
        );


      const finalizado =
        estado ===
        "FINALIZADO";


      const interzonal =
        partido.interzonal === true;


      const escudoLocal =
        escudos[
          partido.local
        ] || "";


      const escudoVisitante =
        escudos[
          partido.visitante
        ] || "";


      let marcador;


      if (
        finalizado
      ) {

        marcador = `

          <div class="score">

            ${partido.golesLocal}
            -
            ${partido.golesVisitante}

          </div>

        `;

      }

      else {

        marcador = `

          <div class="score vs">

            VS

          </div>

        `;

      }


      const etiquetaZona =
        interzonal
          ? "Interzonal"
          : "Zona " +
            partido.zona;


      const textoEstado =
        finalizado
          ? "Finalizado"
          : "Programado";


      const zonasInterzonal =
        Array.isArray(
          partido.zonas
        )
          ? partido.zonas.join(
              " / "
            )
          : "";


      const detalleZona =
        interzonal
          ? zonasInterzonal
          : (
              "Zona " +
              partido.zona
            );


      return `

        <article
          class="match-card ${
            interzonal
              ? "interzonal"
              : ""
          }"
        >


          <div class="match-top">

            <span class="match-zone">

              ${etiquetaZona}

            </span>


            <span
              class="match-status ${
                finalizado
                  ? "status-finalizado"
                  : "status-programado"
              }"
            >

              ${textoEstado}

            </span>

          </div>


          <div class="teams">


            <div class="team home">

              <span class="team-name">

                ${partido.local}

              </span>


              ${
                escudoLocal
                  ? `

                    <img
                      src="${escudoLocal}"
                      alt="Escudo de ${partido.local}"
                    >

                  `
                  : ""
              }

            </div>


            ${marcador}


            <div class="team away">

              ${
                escudoVisitante
                  ? `

                    <img
                      src="${escudoVisitante}"
                      alt="Escudo de ${partido.visitante}"
                    >

                  `
                  : ""
              }


              <span class="team-name">

                ${partido.visitante}

              </span>

            </div>

          </div>


          <div class="match-bottom">

            <span>
              Fecha ${partido.fecha}
            </span>


            <span>
              ${detalleZona}
            </span>

          </div>

        </article>

      `;

    }


    /* =========================================================
       MOSTRAR PARTIDOS
       ========================================================= */

    function mostrarPartidos() {

      const partidos =
        obtenerPartidosFiltrados();


      if (
        partidos.length === 0
      ) {

        partidosContainer.innerHTML = `

          <div class="empty-card">

            <h3>
              No hay partidos
            </h3>

            <p>
              No encontramos partidos
              con los filtros seleccionados.
            </p>

          </div>

        `;

        return;

      }


      const porFecha = {};


      partidos.forEach(
        partido => {

          const fecha =
            partido.fecha;


          if (
            !porFecha[fecha]
          ) {

            porFecha[fecha] = [];

          }


          porFecha[fecha].push(
            partido
          );

        }
      );


      partidosContainer.innerHTML =

        Object.keys(
          porFecha
        )

        .sort(
          (a, b) =>
            Number(a) -
            Number(b)
        )

        .map(
          fecha => {

            const partidosFecha =
              porFecha[fecha];


            return `

              <section
                class="date-section"
              >

                <div
                  class="date-title"
                >

                  <h2>
                    Fecha ${fecha}
                  </h2>


                  <span
                    class="match-count"
                  >

                    ${
                      partidosFecha.length
                    }

                    ${
                      partidosFecha.length === 1
                        ? "partido"
                        : "partidos"
                    }

                  </span>

                </div>


                <div
                  class="matches-grid"
                >

                  ${
                    partidosFecha
                      .map(
                        crearPartido
                      )
                      .join("")
                  }

                </div>

              </section>

            `;

          }
        )

        .join("");

    }


    /* =========================================================
       LIMPIAR FILTROS
       ========================================================= */

    function limpiarFiltros() {

      filtroFecha.value =
        "TODAS";


      filtroZona.value =
        "TODAS";


      filtroEquipo.value =
        "TODOS";


      filtroEstado.value =
        "TODOS";


      mostrarPartidos();

    }


    /* =========================================================
       EVENTOS
       ========================================================= */

    filtroFecha.addEventListener(
      "change",
      mostrarPartidos
    );


    filtroZona.addEventListener(
      "change",
      mostrarPartidos
    );


    filtroEquipo.addEventListener(
      "change",
      mostrarPartidos
    );


    filtroEstado.addEventListener(
      "change",
      mostrarPartidos
    );


    /* =========================================================
       HEADER AL HACER SCROLL
       ========================================================= */

    let ultimaPosicion =
      window.scrollY;


    const header =
      document.getElementById(
        "siteHeader"
      );


    window.addEventListener(
      "scroll",
      () => {

        const posicionActual =
          window.scrollY;


        if (
          posicionActual >
            ultimaPosicion &&
          posicionActual >
            120
        ) {

          header.classList.add(
            "hidden"
          );

        }

        else {

          header.classList.remove(
            "hidden"
          );

        }


        ultimaPosicion =
          posicionActual;

      },
      {
        passive: true
      }
    );


    /* =========================================================
       INICIAR
       ========================================================= */

    cargarFechas();

    cargarEquipos();

    mostrarPartidos();

  </script>


</body>

</html>
