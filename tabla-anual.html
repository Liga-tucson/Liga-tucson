<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tabla Anual | Liga Tucson</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* =========================================================
       TABLA ANUAL
       ========================================================= */

    .tabla-anual-container {
      width: 100%;
      max-width: 1100px;
      margin: 25px auto 50px;
      padding: 0 10px;
      box-sizing: border-box;
    }

    .tabla-anual-titulo {
      text-align: center;
      margin-bottom: 20px;
    }

    .tabla-anual-titulo h1 {
      margin: 0;
      font-size: 28px;
      color: #ffffff;
    }

    .tabla-anual-titulo p {
      margin: 6px 0 0;
      color: #bfc9d4;
      font-size: 14px;
    }

    .tabla-wrapper {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 10px;
    }

    .tabla-anual {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: #ffffff;
      color: #17212b;
      border-radius: 10px;
      overflow: hidden;
    }

    .tabla-anual th {
      background: #0b1f33;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      padding: 9px 3px;
      white-space: nowrap;
    }

    .tabla-anual td {
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      padding: 7px 3px;
      border-bottom: 1px solid #e4e8ec;
      white-space: nowrap;
    }

    .tabla-anual tbody tr:last-child td {
      border-bottom: none;
    }

    /* =========================================================
       ANCHOS
       ========================================================= */

    .col-pos {
      width: 38px;
    }

    .col-equipo {
      width: auto;
      text-align: left !important;
      padding-left: 8px !important;
    }

    .col-pts {
      width: 48px;
    }

    .col-stat {
      width: 37px;
    }

    /* =========================================================
       POSICIÓN
       ========================================================= */

    .posicion {
      font-weight: 700;
    }

    /* =========================================================
       EQUIPO
       ========================================================= */

    .nombre-equipo {
      text-align: left;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================================================
       PUNTOS
       ========================================================= */

    .puntos {
      font-weight: 800;
      color: #0b5fa5;
      font-size: 14px !important;
    }

    /* =========================================================
       DIFERENCIA DE GOL
       ========================================================= */

    .dg-positivo {
      font-weight: 700;
      color: #16803c;
    }

    .dg-negativo {
      font-weight: 700;
      color: #c62828;
    }

    .dg-cero {
      font-weight: 700;
      color: #555555;
    }

    /* =========================================================
       CLASIFICACIONES
       ========================================================= */

    /* Puestos 1 al 6 */
    .clasifica-directo td {
      background: rgba(46, 160, 67, 0.10);
    }

    .clasifica-directo td:first-child {
      border-left: 4px solid #2ea043;
    }

    /* Puestos 7 al 24 */
    .clasifica-playoff td {
      background: rgba(38, 139, 210, 0.08);
    }

    .clasifica-playoff td:first-child {
      border-left: 4px solid #268bd2;
    }

    /* Repechaje */
    .repechaje td {
      background: rgba(198, 40, 40, 0.09);
    }

    .repechaje td:first-child {
      border-left: 4px solid #c62828;
    }

    .etiqueta {
      display: inline-block;
      margin-left: 6px;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 800;
      vertical-align: middle;
      background: #c62828;
      color: #ffffff;
    }

    /* =========================================================
       REFERENCIAS
       ========================================================= */

    .referencias {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 16px;
      margin-top: 15px;
      color: #d5dce3;
      font-size: 11px;
    }

    .referencia {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .referencia-color {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      display: inline-block;
    }

    .referencia-verde {
      background: #2ea043;
    }

    .referencia-azul {
      background: #268bd2;
    }

    .referencia-amarillo {
      background: #d6a500;
    }

    .referencia-rojo {
      background: #c62828;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {

      .tabla-anual-container {
        margin-top: 18px;
        padding: 0 5px;
      }

      .tabla-anual-titulo {
        margin-bottom: 14px;
      }

      .tabla-anual-titulo h1 {
        font-size: 22px;
      }

      .tabla-anual-titulo p {
        font-size: 12px;
      }

      .tabla-wrapper {
        overflow-x: hidden;
      }

      .tabla-anual {
        table-layout: fixed;
      }

      .tabla-anual th {
        font-size: 9px;
        padding: 7px 1px;
      }

      .tabla-anual td {
        font-size: 10px;
        padding: 6px 1px;
      }

      .col-pos {
        width: 25px;
      }

      .col-equipo {
        width: auto;
        padding-left: 5px !important;
        padding-right: 3px !important;
      }

      .col-pts {
        width: 35px;
      }

      .col-stat {
        width: 25px;
      }

      .nombre-equipo {
        font-size: 10px;
      }

      .puntos {
        font-size: 11px !important;
      }

      .etiqueta {
        display: none;
      }

      .referencias {
        font-size: 9px;
        gap: 6px 10px;
        margin-top: 12px;
      }

      .referencia-color {
        width: 9px;
        height: 9px;
      }
    }

    /* =========================================================
       PANTALLAS MUY PEQUEÑAS
       ========================================================= */

    @media (max-width: 390px) {

      .tabla-anual th {
        font-size: 8px;
      }

      .tabla-anual td {
        font-size: 9px;
      }

      .nombre-equipo {
        font-size: 9px;
      }

      .col-pos {
        width: 23px;
      }

      .col-pts {
        width: 32px;
      }

      .col-stat {
        width: 23px;
      }
    }
  </style>
</head>

<body>

  <!-- =======================================================
       ENCABEZADO
       ======================================================= -->

  <header>

    <div class="header-container">

      <a href="index.html" class="logo-link">

        <img
          src="https://raw.githubusercontent.com/ianulisespaez-netizen/Liga-tucson/main/FDDF80B7-4151-4091-AB6F-C5DF10F36391.png"
          alt="Liga Tucson"
          class="logo"
        >

      </a>

      <div class="titulo-header">

        <h1>LIGA TUCSON</h1>

        <p>Liga Tucumana de Fútbol</p>

      </div>

    </div>


    <!-- =====================================================
         MENÚ PRINCIPAL
         ===================================================== -->

    <nav>

      <a href="index.html">
        Inicio
      </a>

      <a href="posiciones.html">
        Posiciones
      </a>

      <a href="tabla-anual.html" class="activo">
        Tabla Anual
      </a>

      <a href="partidos.html">
        Partidos
      </a>

      <a href="equipos.html">
        Equipos
      </a>

      <a href="playoff.html">
        Play-Off
      </a>

    </nav>

  </header>


  <!-- =======================================================
       CONTENIDO
       ======================================================= -->

  <main class="tabla-anual-container">

    <div class="tabla-anual-titulo">

      <h1>
        Tabla Anual
      </h1>

      <p>
        Primera División A — Temporada 2026
      </p>

    </div>


    <!-- =====================================================
         TABLA
         ===================================================== -->

    <div class="tabla-wrapper">

      <table class="tabla-anual">

        <thead>

          <tr>

            <th class="col-pos">
              #
            </th>

            <th class="col-equipo">
              Equipo
            </th>

            <th class="col-pts">
              PTS
            </th>

            <th class="col-stat">
              PJ
            </th>

            <th class="col-stat">
              PG
            </th>

            <th class="col-stat">
              PE
            </th>

            <th class="col-stat">
              PP
            </th>

            <th class="col-stat">
              GF
            </th>

            <th class="col-stat">
              GC
            </th>

            <th class="col-stat">
              DG
            </th>

          </tr>

        </thead>


        <tbody id="tablaAnualBody">

          <tr>

            <td colspan="10">
              Cargando tabla...
            </td>

          </tr>

        </tbody>

      </table>

    </div>


    <!-- =====================================================
         REFERENCIAS
         ===================================================== -->

    <div class="referencias">

      <div class="referencia">

        <span class="referencia-color referencia-verde"></span>

        <span>
          Clasificación directa
        </span>

      </div>


      <div class="referencia">

        <span class="referencia-color referencia-azul"></span>

        <span>
          Play-Off
        </span>

      </div>


      <div class="referencia">

        <span class="referencia-color referencia-rojo"></span>

        <span>
          Repechaje
        </span>

      </div>

    </div>

  </main>


  <!-- =======================================================
       DATOS
       ======================================================= -->

  <script src="datos.js?v=20260926"></script>


  <!-- =======================================================
       TABLA ANUAL
       ======================================================= -->

  <script>

    document.addEventListener("DOMContentLoaded", function () {

      const tbody =
        document.getElementById("tablaAnualBody");


      /* =====================================================
         COMPROBAR DATOS
         ===================================================== */

      if (
        typeof datosLiga === "undefined"
      ) {

        tbody.innerHTML = `
          <tr>
            <td colspan="10">
              No se pudo cargar datos.js.
            </td>
          </tr>
        `;

        return;
      }


      if (
        typeof datosLiga.generarTablaAnual !== "function"
      ) {

        tbody.innerHTML = `
          <tr>
            <td colspan="10">
              No se encontró la función de tabla anual.
            </td>
          </tr>
        `;

        return;
      }


      /* =====================================================
         OBTENER TABLA
         ===================================================== */

      let tabla =
        datosLiga.generarTablaAnual();


      if (
        !Array.isArray(tabla) ||
        tabla.length === 0
      ) {

        tbody.innerHTML = `
          <tr>
            <td colspan="10">
              No hay datos disponibles.
            </td>
          </tr>
        `;

        return;
      }


      /* =====================================================
         ORDEN OFICIAL
         =====================================================

         1. Puntos
         2. Menor cantidad de partidos jugados
         3. Diferencia de gol
         4. Goles a favor
         5. Goles en contra
         6. Orden alfabético
         */

      tabla.sort(function (a, b) {

        if (b.pts !== a.pts) {
          return b.pts - a.pts;
        }

        if (a.pj !== b.pj) {
          return a.pj - b.pj;
        }

        const dgA =
          (a.gf || 0) -
          (a.gc || 0);

        const dgB =
          (b.gf || 0) -
          (b.gc || 0);

        if (dgB !== dgA) {
          return dgB - dgA;
        }

        if (
          (b.gf || 0) !==
          (a.gf || 0)
        ) {

          return (
            (b.gf || 0) -
            (a.gf || 0)
          );

        }

        if (
          (a.gc || 0) !==
          (b.gc || 0)
        ) {

          return (
            (a.gc || 0) -
            (b.gc || 0)
          );

        }

        return a.equipo.localeCompare(
          b.equipo,
          "es"
        );

      });


      /* =====================================================
         LIMPIAR TABLA
         ===================================================== */

      tbody.innerHTML = "";


      /* =====================================================
         CREAR FILAS
         ===================================================== */

      tabla.forEach(function (equipo, index) {

        const posicion =
          index + 1;


        const pts =
          equipo.pts || 0;

        const pj =
          equipo.pj || 0;

        const pg =
          equipo.pg || 0;

        const pe =
          equipo.pe || 0;

        const pp =
          equipo.pp || 0;

        const gf =
          equipo.gf || 0;

        const gc =
          equipo.gc || 0;

        const dg =
          gf - gc;


        /* =================================================
           CLASE DE LA FILA
           ================================================= */

        let claseFila = "";


        /*
         * Puestos 1 al 6
         */

        if (posicion <= 6) {

          claseFila =
            "clasifica-directo";

        }


        /*
         * Puestos 7 al 24
         */

        else if (posicion <= 24) {

          claseFila =
            "clasifica-playoff";

        }


        /*
         * Puestos 41 al 44
         */

        else if (posicion >= 41) {

          claseFila =
            "repechaje";

        }


        /* =================================================
           DIFERENCIA DE GOL
           ================================================= */

        let claseDG =
          "dg-cero";


        if (dg > 0) {

          claseDG =
            "dg-positivo";

        }


        if (dg < 0) {

          claseDG =
            "dg-negativo";

        }


        /* =================================================
           ETIQUETA REPECHAJE
           ================================================= */

        let etiqueta = "";


        if (posicion >= 41) {

          etiqueta =
            `<span class="etiqueta">REPECHAJE</span>`;

        }


        /* =================================================
           CREAR FILA
           ================================================= */

        const fila =
          document.createElement("tr");


        fila.className =
          claseFila;


        /*
         * IMPORTANTE:
         *
         * En datos.js la propiedad se llama
         * equipo.equipo
         *
         * NO equipo.nombre
         */

        fila.innerHTML = `

          <td class="posicion">
            ${posicion}
          </td>

          <td class="nombre-equipo col-equipo">

            ${equipo.equipo}

            ${etiqueta}

          </td>

          <td class="puntos">
            ${pts}
          </td>

          <td>
            ${pj}
          </td>

          <td>
            ${pg}
          </td>

          <td>
            ${pe}
          </td>

          <td>
            ${pp}
          </td>

          <td>
            ${gf}
          </td>

          <td>
            ${gc}
          </td>

          <td class="${claseDG}">
            ${dg > 0 ? "+" : ""}${dg}
          </td>

        `;


        tbody.appendChild(fila);

      });

    });

  </script>

</body>
</html>
