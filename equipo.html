<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Equipo | Liga Tucson</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6fa;
    color:#10203c;
}

/* =========================
   HEADER
========================= */

.site-header{
    background:#0b1f3a;
    color:white;
}

.header-top{
    text-align:center;
    padding:28px 20px 25px;
}

.header-logo{
    width:125px;
    height:125px;
    object-fit:contain;
    display:block;
    margin:0 auto 18px;
}

.header-title h1{
    margin:0;
    font-size:42px;
    font-weight:800;
}

/* =========================
   MENU
========================= */

.main-nav{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    padding:15px 20px 28px;
    flex-wrap:wrap;
}

.main-nav a{
    text-decoration:none;
    color:white;
    background:#1d3c70;
    padding:14px 24px;
    border-radius:15px;
    font-size:20px;
    transition:.2s;
}

.main-nav a:hover{
    background:#2c568f;
}

.main-nav a.active{
    background:#4aa0d8;
}

/* =========================
   CONTENEDOR
========================= */

.container{
    max-width:1000px;
    margin:auto;
    padding:45px 25px 70px;
}

/* =========================
   VOLVER
========================= */

.back-link{
    display:inline-block;
    margin-bottom:35px;
    color:#2864a5;
    text-decoration:none;
    font-size:30px;
    font-weight:800;
}

.back-link:hover{
    text-decoration:underline;
}

/* =========================
   PERFIL EQUIPO
========================= */

.team-card{
    background:white;
    border-radius:32px;
    padding:48px 30px;
    text-align:center;
    box-shadow:0 8px 28px rgba(0,0,0,.08);
    margin-bottom:45px;
}

.team-crest-box{
    width:205px;
    height:205px;
    background:#f7f9fc;
    border-radius:28px;
    margin:0 auto 35px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.team-crest{
    width:100%;
    height:100%;
    object-fit:contain;
}

.zone-badge{
    display:inline-block;
    background:#4aa0d8;
    color:white;
    padding:12px 28px;
    border-radius:35px;
    font-size:25px;
    font-weight:800;
    margin-bottom:22px;
}

.team-name{
    margin:0;
    font-size:48px;
    font-weight:800;
}

.team-position{
    margin:18px 0 0;
    font-size:34px;
    font-weight:800;
}

/* =========================
   ESTADISTICAS
========================= */

.stats-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
    margin-bottom:45px;
}

.stat-card{
    background:white;
    border-radius:25px;
    padding:30px 20px;
    text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,.06);
}

.stat-number{
    font-size:42px;
    font-weight:800;
    margin-bottom:12px;
}

.stat-label{
    color:#68758a;
    font-size:23px;
    font-weight:700;
}

/* =========================
   PLAY-OFF
========================= */

.playoff-card{
    background:linear-gradient(135deg,#10284d,#234a83);
    color:white;
    border-radius:32px;
    padding:45px 25px;
    text-align:center;
    margin-bottom:50px;
}

.playoff-card h2{
    font-size:43px;
    margin:0 0 20px;
}

.playoff-card p{
    font-size:25px;
    line-height:1.45;
    margin:0 auto 30px;
    max-width:750px;
}

.playoff-button{
    display:inline-block;
    background:#4aa0d8;
    color:white;
    text-decoration:none;
    padding:17px 38px;
    border-radius:18px;
    font-size:25px;
    font-weight:800;
}

/* =========================
   PARTIDOS
========================= */

.matches-section{
    background:white;
    border-radius:30px;
    padding:40px;
    box-shadow:0 6px 22px rgba(0,0,0,.06);
    margin-bottom:45px;
}

.matches-section h2{
    margin:0 0 35px;
    font-size:40px;
}

.match-item{
    padding:25px 15px;
    border-bottom:2px solid #e8edf3;
}

.match-item:last-child{
    border-bottom:none;
}

.match-date{
    color:#68758a;
    font-size:23px;
    font-weight:800;
    margin-bottom:18px;
}

.match-content{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
}

.match-teams{
    text-align:center;
    flex:1;
    font-size:27px;
    font-weight:800;
    line-height:1.25;
}

.match-zone{
    color:#7a8799;
    font-size:20px;
    font-weight:500;
    margin-top:8px;
}

.match-score{
    min-width:120px;
    text-align:center;
    font-size:34px;
    font-weight:800;
}

.score-win{
    color:#3d8a4d;
}

.score-draw{
    color:#c88a22;
}

.score-loss{
    color:#bd4736;
}

.upcoming{
    color:#2864a5;
    font-size:32px;
    font-weight:800;
}

/* =========================
   SIN PARTIDOS
========================= */

.no-matches{
    color:#68758a;
    font-size:21px;
    text-align:center;
    padding:25px;
}

/* =========================
   FOOTER
========================= */

footer{
    background:#0b1f3a;
    color:#d5deea;
    text-align:center;
    padding:30px 20px;
    font-size:16px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .header-top{
        padding:25px 15px 22px;
    }

    .header-logo{
        width:110px;
        height:110px;
    }

    .header-title h1{
        font-size:32px;
    }

    .main-nav{
        gap:8px;
        padding:12px 8px 28px;
    }

    .main-nav a{
        font-size:20px;
        padding:12px 18px;
    }

    .container{
        padding:35px 14px 55px;
    }

    .back-link{
        font-size:27px;
    }

    .team-card{
        padding:45px 20px;
    }

    .team-crest-box{
        width:185px;
        height:185px;
    }

    .team-name{
        font-size:45px;
    }

    .team-position{
        font-size:32px;
    }

    .stats-grid{
        grid-template-columns:1fr 1fr;
        gap:20px;
    }

    .stat-card{
        padding:27px 15px;
    }

    .stat-number{
        font-size:38px;
    }

    .stat-label{
        font-size:21px;
    }

    .playoff-card{
        padding:38px 20px;
    }

    .playoff-card h2{
        font-size:38px;
    }

    .playoff-card p{
        font-size:22px;
    }

    .matches-section{
        padding:30px 20px;
    }

    .matches-section h2{
        font-size:36px;
    }

    .match-content{
        gap:10px;
    }

    .match-teams{
        font-size:24px;
    }

    .match-score{
        min-width:95px;
        font-size:30px;
    }

}

</style>

</head>

<body>

<header class="site-header">

    <div class="header-top">

        <img
            class="header-logo"
            src="FDDF80B7-4151-4091-AB6F-C5DF10F36391.png"
            alt="Liga Tucson"
        >

        <div class="header-title">
            <h1>LIGA TUCSON</h1>
        </div>

    </div>


    <!-- =========================
         MENU SIN EMOJIS
    ========================== -->

    <nav class="main-nav">

        <a href="index.html">
            Inicio
        </a>

        <a href="posiciones.html">
            Posiciones
        </a>

        <a href="partidos.html">
            Partidos
        </a>

        <a href="equipos.html" class="active">
            Equipos
        </a>

        <a href="playoff.html">
            Play-Off
        </a>

    </nav>

</header>


<main class="container">

    <a
        href="equipos.html"
        class="back-link"
    >
        ← Volver a equipos
    </a>


    <section
        id="teamProfile"
        class="team-card"
    ></section>


    <section
        id="teamStats"
        class="stats-grid"
    ></section>


    <section
        id="playoffSection"
        class="playoff-card"
    ></section>


    <section class="matches-section">

        <h2>
            Partidos jugados
        </h2>

        <div id="playedMatches"></div>

    </section>


    <section class="matches-section">

        <h2>
            Próximos partidos
        </h2>

        <div id="upcomingMatches"></div>

    </section>

</main>


<footer>
    Liga Tucson — Liga Tucumana de Fútbol
</footer>


<script src="datos.js?v=20260928"></script>


<script>

/* =========================================================
   ESCUDOS
========================================================= */

const escudos = {

    "Talleres":"IMG_1621.png",
    "Juventud Unida":"IMG_1622.png",
    "Estación Experimental":"IMG_1623.png",
    "Central Norte":"21B48DFD-98C8-4EDD-B633-35738F9B089D.png",
    "Villa Mitre":"IMG_1625.jpeg",
    "All Boys":"IMG_1627.png",
    "San José":"IMG_1628.png",

    "Argentinos del Norte":"IMG_1629.png",
    "San Martín":"IMG_1630.png",
    "San Antonio":"IMG_1631.jpeg",
    "Atlético Tucumán":"IMG_1632.jpeg",
    "Sportivo Guzmán":"IMG_1633.png",
    "Amalia":"IMG_1634.png",
    "Tucumán Central":"IMG_1635.png",

    "Garmendia":"IMG_1637.jpeg",
    "Atlético Concepción":"IMG_1638.png",
    "San Juan":"9D389031-3751-4B06-A800-AE5B7A426605.png",
    "San Lorenzo (DG)":"IMG_1646.png",
    "Unión del Norte":"IMG_1641.jpeg",
    "Lastenia":"IMG_1645.png",
    "Cruz Alta":"IMG_1644.png",

    "Bella Vista":"IMG_1651.png",
    "San Fernando":"IMG_1652.png",
    "Almirante Brown":"IMG_1653.jpeg",
    "Famaillá":"IMG_1654.png",
    "Ateneo Parroquial Alderetes":"IMG_1655.png",
    "Santa Lucía":"IMG_1656.jpeg",
    "San Pablo":"IMG_1671.png",

    "Alto Verde":"IMG_1657.png",
    "Concepción FC":"IMG_1658.png",
    "Azucarera Argentina":"IMG_1659.png",
    "Ñuñorco":"IMG_1660.png",
    "Unión Simoca":"IMG_1661.jpeg",
    "San Ramón":"IMG_1662.jpeg",
    "Santa Rosa":"IMG_1663.png",
    "La Providencia":"IMG_1664.jpeg",

    "Deportivo Aguilares":"IMG_1665.png",
    "San Lorenzo (SA)":"IMG_1666.webp",
    "Jorge Newbery":"IMG_1673.png",
    "Graneros":"IMG_1667.jpeg",
    "Santa Ana":"IMG_1668.png",
    "Trinidad":"IMG_1669.png",
    "Marapa":"IMG_1670.jpeg",
    "Llorens":"IMG_1672.jpeg"

};


/* =========================================================
   NORMALIZAR NOMBRES
========================================================= */

function normalizarNombre(nombre){

    return String(nombre || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"");

}


/* =========================================================
   OBTENER EQUIPO
========================================================= */

const params = new URLSearchParams(
    window.location.search
);

const nombreParametro =
    params.get("equipo") ||
    params.get("nombre");


const nombreBuscado =
    normalizarNombre(nombreParametro);


let equipoEncontrado = null;
let zonaEncontrada = null;


/* Buscar equipo dentro de las zonas */

for(const zona in datosLiga.zonas){

    const lista =
        datosLiga.zonas[zona] || [];

    const encontrado =
        lista.find(equipo => {

            const nombre =
                typeof equipo === "string"
                    ? equipo
                    : equipo.equipo;

            return (
                normalizarNombre(nombre) ===
                nombreBuscado
            );

        });

    if(encontrado){

        equipoEncontrado =
            typeof encontrado === "string"
                ? encontrado
                : encontrado.equipo;

        zonaEncontrada = zona;

        break;

    }

}


/* =========================================================
   SI NO ENCUENTRA EL EQUIPO
========================================================= */

if(!equipoEncontrado){

    document.getElementById("teamProfile").innerHTML = `

        <h2>Equipo no encontrado</h2>

        <p>
            No se pudo encontrar el equipo solicitado.
        </p>

    `;

    document.getElementById("teamStats").innerHTML = "";

    document.getElementById("playoffSection").innerHTML = "";

    document.getElementById("playedMatches").innerHTML = "";

    document.getElementById("upcomingMatches").innerHTML = "";

}


/* =========================================================
   CARGAR EQUIPO
========================================================= */

else{

    /* -----------------------------------------------------
       TABLA DE LA ZONA
    ----------------------------------------------------- */

    let tablaZona = [];

    if(
        typeof datosLiga.tablasClausura !== "undefined" &&
        datosLiga.tablasClausura[zonaEncontrada]
    ){

        tablaZona =
            [...datosLiga.tablasClausura[zonaEncontrada]];

    }


    /* -----------------------------------------------------
       ESTADISTICAS
    ----------------------------------------------------- */

    let estadisticas =
        tablaZona.find(

            equipo =>
                normalizarNombre(equipo.equipo) ===
                nombreBuscado

        );


    /*
       Compatibilidad por si los datos están
       directamente dentro de datosLiga.zonas.
    */

    if(!estadisticas){

        const equipoZona =
            datosLiga.zonas[zonaEncontrada]
                .find(equipo => {

                    const nombre =
                        typeof equipo === "string"
                            ? equipo
                            : equipo.equipo;

                    return (
                        normalizarNombre(nombre) ===
                        nombreBuscado
                    );

                });

        if(
            equipoZona &&
            typeof equipoZona === "object"
        ){

            estadisticas = equipoZona;

        }

    }


    if(!estadisticas){

        estadisticas = {

            pj:0,
            pg:0,
            pe:0,
            pp:0,
            gf:0,
            gc:0,
            dg:0,
            pts:0

        };

    }


    /* -----------------------------------------------------
       POSICION
    ----------------------------------------------------- */

    let posicion = "-";

    if(tablaZona.length){

        const indice =
            tablaZona.findIndex(

                equipo =>
                    normalizarNombre(equipo.equipo) ===
                    nombreBuscado

            );

        if(indice >= 0){

            posicion =
                `${indice + 1}° puesto`;

        }

    }


    /* -----------------------------------------------------
       ESCUDO
    ----------------------------------------------------- */

    const escudo =
        escudos[equipoEncontrado] || "";


    /* -----------------------------------------------------
       PERFIL
    ----------------------------------------------------- */

    document.getElementById(
        "teamProfile"
    ).innerHTML = `

        <div class="team-crest-box">

            ${
                escudo
                ?
                `
                <img
                    src="${escudo}"
                    class="team-crest"
                    alt="${equipoEncontrado}"
                >
                `
                :
                ""
            }

        </div>


        <div class="zone-badge">
            Zona ${zonaEncontrada}
        </div>


        <h2 class="team-name">
            ${equipoEncontrado}
        </h2>


        <p class="team-position">
            ${posicion}
        </p>

    `;


    /* -----------------------------------------------------
       ESTADISTICAS
    ----------------------------------------------------- */

    document.getElementById(
        "teamStats"
    ).innerHTML = `

        <div class="stat-card">
            <div class="stat-number">
                ${estadisticas.pj || 0}
            </div>
            <div class="stat-label">
                PJ
            </div>
        </div>


        <div class="stat-card">
            <div class="stat-number">
                ${estadisticas.pg || 0}
            </div>
            <div class="stat-label">
                PG
            </div>
        </div>


        <div class="stat-card">
            <div class="stat-number">
                ${estadisticas.pe || 0}
            </div>
            <div class="stat-label">
                PE
            </div>
        </div>


        <div class="stat-card">
            <div class="stat-number">
                ${estadisticas.pp || 0}
            </div>
            <div class="stat-label">
                PP
            </div>
        </div>


        <div class="stat-card">
            <div class="stat-number">
                ${estadisticas.gf || 0}
            </div>
            <div class="stat-label">
                GF
            </div>
        </div>


        <div class="stat-card">
            <div class="stat-number">
                ${estadisticas.gc || 0}
            </div>
            <div class="stat-label">
                GC
            </div>
        </div>


        <div class="stat-card">
            <div class="stat-number">
                ${estadisticas.dg || 0}
            </div>
            <div class="stat-label">
                DG
            </div>
        </div>


        <div class="stat-card">
            <div class="stat-number">
                ${estadisticas.pts || 0}
            </div>
            <div class="stat-label">
                PTS
            </div>
        </div>

    `;


    /* -----------------------------------------------------
       PLAY-OFF
    ----------------------------------------------------- */

    document.getElementById(
        "playoffSection"
    ).innerHTML = `

        <h2>
            Play-Off
        </h2>

        <p>
            Consultá la clasificación y las llaves
            del Play-Off del Clausura 2026.
        </p>

        <a
            href="playoff.html"
            class="playoff-button"
        >
            Ver Play-Off
        </a>

    `;


    /* =====================================================
       PARTIDOS DEL EQUIPO
    ===================================================== */

    let partidosEquipo = [];

    if(
        Array.isArray(datosLiga.partidos)
    ){

        partidosEquipo =
            datosLiga.partidos.filter(partido => {

                return (

                    normalizarNombre(partido.local) ===
                    nombreBuscado

                    ||

                    normalizarNombre(partido.visitante) ===
                    nombreBuscado

                );

            });

    }


    partidosEquipo.sort(
        (a,b) =>
            Number(a.fecha || 0) -
            Number(b.fecha || 0)
    );


    /* =====================================================
       PARTIDOS JUGADOS
    ===================================================== */

    const jugados =
        partidosEquipo.filter(partido => {

            return (

                partido.golesLocal !== null &&
                partido.golesLocal !== undefined &&

                partido.golesVisitante !== null &&
                partido.golesVisitante !== undefined

            );

        });


    const proximos =
        partidosEquipo.filter(partido => {

            return !(
                partido.golesLocal !== null &&
                partido.golesLocal !== undefined &&

                partido.golesVisitante !== null &&
                partido.golesVisitante !== undefined

            );

        });


    /* =====================================================
       RENDER PARTIDO
    ===================================================== */

    function renderPartido(partido){

        const esLocal =
            normalizarNombre(partido.local) ===
            nombreBuscado;


        const rival =
            esLocal
                ? partido.visitante
                : partido.local;


        const marcadorLocal =
            Number(partido.golesLocal);


        const marcadorVisitante =
            Number(partido.golesVisitante);


        let claseResultado =
            "score-draw";


        if(esLocal){

            if(marcadorLocal > marcadorVisitante){

                claseResultado =
                    "score-win";

            }
            else if(marcadorLocal < marcadorVisitante){

                claseResultado =
                    "score-loss";

            }

        }
        else{

            if(marcadorVisitante > marcadorLocal){

                claseResultado =
                    "score-win";

            }
            else if(marcadorVisitante < marcadorLocal){

                claseResultado =
                    "score-loss";

            }

        }


        const zona =
            partido.interzonal
                ? "Interzonal"
                : `Zona ${zonaEncontrada}`;


        return `

            <div class="match-item">

                <div class="match-date">
                    Fecha ${partido.fecha}
                </div>


                <div class="match-content">

                    <div class="match-teams">

                        ${
                            esLocal
                                ? `
                                ${equipoEncontrado}
                                <br>
                                vs. ${rival}
                                `
                                :
                                `
                                ${equipoEncontrado}
                                <br>
                                @ ${rival}
                                `
                        }

                        <div class="match-zone">
                            ${zona}
                        </div>

                    </div>


                    <div class="match-score ${claseResultado}">

                        ${marcadorLocal}
                        -
                        ${marcadorVisitante}

                    </div>

                </div>

            </div>

        `;

    }


    /* =====================================================
       RENDER PROXIMO
    ===================================================== */

    function renderProximo(partido){

        const esLocal =
            normalizarNombre(partido.local) ===
            nombreBuscado;


        const rival =
            esLocal
                ? partido.visitante
                : partido.local;


        const zona =
            partido.interzonal
                ? "Interzonal"
                : `Zona ${zonaEncontrada}`;


        return `

            <div class="match-item">

                <div class="match-date">
                    Fecha ${partido.fecha}
                </div>


                <div class="match-content">

                    <div class="match-teams">

                        ${
                            esLocal
                                ? `
                                ${equipoEncontrado}
                                <br>
                                vs. ${rival}
                                `
                                :
                                `
                                ${equipoEncontrado}
                                <br>
                                @ ${rival}
                                `
                        }

                        <div class="match-zone">
                            ${zona}
                        </div>

                    </div>


                    <div class="match-score upcoming">
                        Próximo
                    </div>

                </div>

            </div>

        `;

    }


    /* =====================================================
       MOSTRAR JUGADOS
    ===================================================== */

    const contenedorJugados =
        document.getElementById(
            "playedMatches"
        );


    if(!jugados.length){

        contenedorJugados.innerHTML = `

            <div class="no-matches">
                No hay partidos jugados.
            </div>

        `;

    }
    else{

        contenedorJugados.innerHTML =
            jugados
                .map(renderPartido)
                .join("");

    }


    /* =====================================================
       MOSTRAR PROXIMOS
    ===================================================== */

    const contenedorProximos =
        document.getElementById(
            "upcomingMatches"
        );


    if(!proximos.length){

        contenedorProximos.innerHTML = `

            <div class="no-matches">
                No hay próximos partidos.
            </div>

        `;

    }
    else{

        contenedorProximos.innerHTML =
            proximos
                .map(renderProximo)
                .join("");

    }

}

</script>

</body>

</html>
